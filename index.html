<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>코칭2 · 촬영 후 구간 반복</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0d1117">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--ink:#0d1117;--panel:#161c26;--line:#273244;--text:#e8edf3;--mute:#8a97aa;--hong:#ff5d5d;--chung:#4aa8ff;--amber:#ffc93c;--ok:#5fe0a0;--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--ink);color:var(--text);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
body{min-height:100dvh;padding:calc(10px + var(--safe-t)) 14px calc(16px + var(--safe-b));max-width:760px;margin:0 auto}
h1{font-size:19px;margin:4px 0 10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
h1 small{font-size:12px;font-weight:600;color:var(--mute)}
.stage{position:relative;background:#000;border-radius:14px;overflow:hidden;border:3px solid var(--line);height:calc(100dvh - 380px);min-height:340px;display:grid;place-items:center}
.stage.prep{border-color:var(--amber)}.stage.rec{border-color:var(--hong)}.stage.play{border-color:var(--chung)}
.stage:fullscreen{border-radius:0;aspect-ratio:auto;width:100vw;height:100dvh}
#live,#disp{width:100%;height:100%;object-fit:contain;display:block}
.mir #live,.mir #disp{transform:scaleX(-1)}
.stage.grid::after{content:'';position:absolute;inset:0;pointer-events:none;background-size:25% 25%;background-image:linear-gradient(to right,rgba(255,255,255,.3) 1px,transparent 1px),linear-gradient(to bottom,rgba(255,255,255,.3) 1px,transparent 1px)}
.badge{position:absolute;left:8px;top:8px;background:rgba(0,0,0,.7);border:1px solid var(--line);padding:6px 12px;border-radius:999px;font-size:14px;font-weight:800;font-variant-numeric:tabular-nums}
#clk{position:absolute;left:10px;top:46px;z-index:3;font-size:14px;font-weight:800;color:#fff;text-shadow:0 0 4px #000,0 0 4px #000;font-variant-numeric:tabular-nums;pointer-events:none}
.badge.rec{border-color:var(--hong);color:var(--hong)}.badge.play{border-color:var(--chung);color:var(--chung)}
.cd{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.38);text-align:center;pointer-events:none}
.cd small{font-size:clamp(16px,4.5vmin,30px);font-weight:800;color:#fff;text-shadow:0 2px 8px #000}
.cd b{font-size:clamp(110px,42vmin,360px);line-height:1;color:var(--amber);text-shadow:0 4px 20px #000;font-variant-numeric:tabular-nums}
.wait{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:18px;background:rgba(0,0,0,.72);line-height:1.6}
.wait b{font-size:30px;display:block}.wait span{color:var(--mute);font-size:14px}
.bar{position:absolute;left:0;right:0;bottom:0;height:8px;background:rgba(255,255,255,.15)}.bar i{display:block;height:100%;width:0;background:var(--hong)}
button,select{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-height:46px;cursor:pointer}
button:active{transform:translateY(1px)}
button.main{background:var(--hong);border-color:var(--hong);color:#190606;font-weight:800;font-size:17px;padding:14px 22px;flex:1 1 100%}
button.on{border-color:var(--chung);color:var(--chung)}
button:disabled{opacity:.45}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.row>button{flex:1 1 auto}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:12px}
.panel h2{font-size:14px;margin:0 0 8px;color:var(--mute);font-weight:700}
.set{display:flex;align-items:center;gap:10px;margin-top:6px}.set label{width:84px;font-weight:700;font-size:14px}
.set input{flex:1;accent-color:var(--chung);height:30px}.set output{min-width:48px;text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
#tl{position:relative;height:78px;background:#0b0f16;border:1px solid var(--line);border-radius:10px;touch-action:none;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:pointer}
#sel{position:absolute;top:0;bottom:0;background:rgba(74,168,255,.35);border-left:4px solid var(--chung);border-right:4px solid var(--chung)}
#ph{position:absolute;top:0;bottom:0;width:3px;background:var(--hong);margin-left:-1px}
.ends{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);margin:4px 2px}
#info{font-weight:800;text-align:center;font-variant-numeric:tabular-nums;margin-top:6px;white-space:pre-line}
#tp{position:absolute;top:0;bottom:0;width:0;pointer-events:none}
#tp::before{content:'';position:absolute;top:0;bottom:0;left:-2px;width:4px;background:var(--amber);box-shadow:0 0 8px var(--amber)}
#tp b{position:absolute;top:3px;left:0;background:var(--amber);color:#1b1200;font-size:13px;font-weight:900;padding:2px 8px;border-radius:999px;white-space:nowrap;font-variant-numeric:tabular-nums}
#tp i{position:absolute;bottom:5px;left:-11px;width:22px;height:22px;border-radius:50%;background:var(--amber);border:3px solid #fff;box-shadow:0 0 0 2px #000}
.cmp>div{position:relative}
@keyframes shine{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
@keyframes fly{0%{transform:translate(0,0) scale(.4) rotate(0);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1.4) rotate(260deg);opacity:0}}
@keyframes glow{0%,100%{box-shadow:0 0 10px #ffd23f}50%{box-shadow:0 0 34px 6px #ffd23f}}
@keyframes drop{0%{transform:translate(-50%,-80px) scale(.3);opacity:0}60%{transform:translate(-50%,6px) scale(1.3);opacity:1}100%{transform:translate(-50%,0) scale(1)}}
button.cup,button.cupBig{position:relative;overflow:hidden;box-shadow:0 6px 0 #b8860b,0 10px 20px rgba(255,210,63,.35);animation:pulse 1.6s ease-in-out infinite}
button.cup::after,button.cupBig::after{content:'';position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.75) 50%,transparent 70%);background-size:200% 100%;animation:shine 2.2s linear infinite;pointer-events:none}
button.cup:active,button.cupBig:active{animation:none;transform:translateY(5px);box-shadow:0 1px 0 #b8860b}
button.pick{box-shadow:0 5px 0 rgba(0,0,0,.5);transition:transform .08s,box-shadow .08s}
button.pick:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.5)}
.cmp video{transition:opacity .3s,filter .3s}
.cmp video.win{border-color:#ffd23f!important;animation:glow .5s ease-in-out 3;filter:brightness(1.15)}
.cmp video.lose{opacity:.25;filter:grayscale(1)}
.crown{position:absolute;left:50%;top:18px;font-size:54px;line-height:1;animation:drop .5s ease-out forwards;pointer-events:none;text-shadow:0 4px 12px #000}
.sp{position:fixed;pointer-events:none;z-index:300;font-size:24px;animation:fly .95s ease-out forwards}
button.danger{border-color:var(--hong);color:var(--hong);font-weight:800}
button.cup{background:#ffd23f;border-color:#ffd23f;color:#2a1300;font-weight:800;font-size:16px;flex:1 1 100%}
.pop{margin:auto;text-align:center;display:flex;flex-direction:column;gap:14px;width:100%;max-width:420px}
.pop h3{font-size:24px}
button.cupBig{font-size:22px;padding:28px 14px;border-radius:18px;background:#ffd23f;border-color:#ffd23f;color:#2a1300;font-weight:900;width:100%}
.cmp.one{justify-content:center}.cmp.one>div{max-width:560px}
.err{background:#2a1316;border:1px solid var(--hong);color:#ffd0d0;border-radius:12px;padding:10px 12px;margin-top:10px;font-size:13.5px;line-height:1.5}
.note{font-size:12.5px;color:var(--mute);line-height:1.55;margin:10px 2px 0}

#startRow.pl button{flex:1 1 0;font-size:15px;padding:14px 6px}
#chkTop{position:fixed;left:0;right:0;top:0;z-index:60;background:#161c26;border-bottom:1px solid var(--line);padding:calc(8px + var(--safe-t)) 12px 8px;display:flex;align-items:center;gap:10px}
#chkTop button{min-height:42px;padding:8px 18px;font-weight:800;background:var(--chung);border-color:var(--chung);color:#05121f}
body.chk{padding-top:calc(66px + var(--safe-t));padding-bottom:calc(92px + var(--safe-b))}
#nextBar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:#161c26;border-top:1px solid var(--line);padding:10px 12px calc(10px + var(--safe-b))}
#nextBar button{width:100%;min-height:56px;font-size:18px;font-weight:900;background:var(--ok);border-color:var(--ok);color:#06210f}
body.chk .hideChk{display:none!important}
button.ana{width:100%;margin:0;background:#ffd23f;border-color:#ffd23f;color:#2a1300;font-weight:800;font-size:16px}
#ov{position:fixed;inset:0;z-index:200;background:#0b0f16;display:flex;flex-direction:column;gap:8px;padding:calc(10px + var(--safe-t)) 12px calc(12px + var(--safe-b));overflow:auto}
#ov h3{margin:0;font-size:17px}
.cmp{display:flex;gap:8px;flex:1;min-height:220px}
.cmp>div{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0}
.cmp label{font-weight:800;font-size:13px;text-align:center}
.cmp video{width:100%;flex:1;min-height:0;object-fit:contain;background:#000;border-radius:10px;border:2px solid var(--line)}
button.pick{font-weight:800;font-size:16px;padding:14px 8px}
button.pickA{background:var(--chung);border-color:var(--chung);color:#06101c}
button.pickB{background:var(--hong);border-color:var(--hong);color:#190606}
</style>
</head>
<body>
<h1 class="hideChk">🥋 코칭2 <small>이동 시간 → 촬영 → 원하는 구간만 반복</small></h1>

<div id="nextBar" hidden><button id="nextB">✅ 보관하고 다음 촬영</button></div>
<div id="chkTop" hidden><button id="chkBack">← 뒤로</button><b>🔍 동작체크</b></div>

<div class="stage mir" id="stage">
  <video id="live" playsinline muted></video>
  <canvas id="disp" width="960" height="540" hidden></canvas>
  <div class="badge" id="badge" hidden></div>
  <div id="clk" hidden></div>
  <div class="cd" id="cd" hidden><small>🏃 자리로 이동하세요! 곧 촬영돼요</small><b id="cdNum">5</b></div>
  <div class="bar" id="bar" hidden><i id="barFill"></i></div>
  <div class="wait" id="wait"><div><b>카메라를 켜세요</b><span>시작을 누르면 이동 시간 뒤 자동으로 촬영돼요</span></div></div>
</div>
<div class="row" id="spdRow" hidden><button data-s="0.25">0.25x</button><button data-s="0.5">0.5x</button><button data-s="0.75">0.75x</button><button data-s="1" class="on">1.0x</button></div>
<div id="msg" style="font-size:13px;color:var(--amber);margin:6px 2px 0"></div>
<div class="err" id="err" hidden></div>

<div class="row hideChk" id="startRow">
  <button class="main" id="start">📷 카메라 시작</button>
  <button class="danger" id="delMain" hidden>🗑 삭제하기</button>
</div>
<div class="row hideChk" id="cupRow" hidden><button class="cup" id="cupBtn">🏆 월드컵 진행하기</button></div>

<div class="panel hideChk">
  <h2>시간 설정</h2>
  <div class="set"><label for="prepS">이동 시간</label><input type="range" id="prepS" min="0" max="20" step="1" value="5"><output id="prepO">5초</output></div>
  <div class="set"><label for="recS">촬영 시간</label><input type="range" id="recS" min="2" max="30" step="1" value="5"><output id="recO">5초</output></div>
</div>

<div class="panel hideChk" id="tour" hidden>
  <h2>🏆 이번 동작 기록</h2>
  <div id="tourS" style="font-size:14px;line-height:1.6;white-space:pre-line"></div>
  <div class="row"><button id="tNew">🔄 다른 동작 촬영하기 (기록 초기화)</button></div>
</div>

<div class="panel hideChk" id="chkPanel" hidden>
  <button class="ana" id="chk">🔍 동작체크하기</button>
</div>

<div class="panel" id="playBox" hidden>
  <h2>구간 반복 — 막대 아무 곳이나 터치(재생 중에도 OK)해서 위치를 잡고, 시작점·끝점 버튼을 눌러요</h2>
  <div id="tl"><div id="sel"></div><div id="ph"></div><div id="tp" hidden><b id="tpT"></b><i></i></div></div>
  <div class="ends"><span>0초</span><span id="endLbl"></span></div>
  <div id="info"></div>
  <div class="row">
    <button id="setA">⏮ 여기를 시작점</button>
    <button id="setB">여기를 끝점 ⏭</button>
    <button id="allR">↔ 전체</button>
  </div>
  <div class="row">
    <button id="pp">⏸ 정지</button>
    <button id="stB">◀ 1프레임</button>
    <button id="stF">1프레임 ▶</button>
    <select id="spd" hidden aria-label="재생 속도"><option value="0.25">0.25배</option><option value="0.5">0.5배</option><option value="1" selected>1배</option></select>
  </div>
  <div class="row"><button id="shr1">📤 이 영상 카톡·갤러리로 보내기</button></div>
  <div class="row"><button id="del" class="danger">🗑 이 영상 삭제 (맘에 안 들어요)</button></div>
</div>

<div class="row">
  <button id="mirror" class="on">🪞 좌우반전</button>
  <button id="grid">▦ 격자</button>
  <button id="snd" class="on">🔊 소리</button>
  <button id="full">⛶ 전체화면</button>
</div>

<p class="note">촬영 영상은 이 기기 안에만 잠깐 저장되고 인터넷으로 보내지 않아요. 휴대폰을 고정해 두고 촬영하세요. 카메라는 <b>https</b> 주소에서만 켜져요.</p>

<div id="ov" hidden></div>
<div id="rv" style="position:fixed;left:0;top:0;width:4px;height:4px;overflow:hidden;opacity:.01;pointer-events:none;z-index:-1"></div>


<script>
const $=id=>document.getElementById(id);
const clk=$('clk'),live=$('live'),disp=$('disp'),dctx=disp.getContext('2d'),stage=$('stage'),tl=$('tl');
const cap=document.createElement('canvas'),cctx=cap.getContext('2d');
const FPS=24;
let stream=null,mode='idle',prepSec=5,recSec=5,frames=[],dur=0,A=0,B=0,ph=0,playing=true,speed=1,dragging=false;
let tp=null,mr=null,chunks=[],clipBlob=null,clipP=Promise.resolve();
let prepEnd=0,recStart=0,timer=null,pending=0,lastDrawn=null,decoding=false,lastTick=performance.now(),lastNum=null,wake=null,sound=true,ac=null;

function showErr(m){const e=$('err');e.textContent=m;e.hidden=!m;}
function beep(f,d){ if(!sound||!ac) return; try{ const o=ac.createOscillator(),g=ac.createGain(); o.frequency.value=f; g.gain.value=.25; o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime+d); }catch(e){} }

function setMode(m){
  mode=m;
  stage.classList.remove('prep','rec','play'); if(m==='prep'||m==='rec'||m==='play') stage.classList.add(m);
  live.hidden=(m==='play'); disp.hidden=(m!=='play');
  $('wait').hidden=!!stream; $('cd').hidden=(m!=='prep'); $('bar').hidden=(m!=='rec');
  $('playBox').hidden=(m!=='play'); $('badge').hidden=(m==='idle'||m==='proc');
  $('start').textContent= m==='prep'||m==='rec' ? '■ 취소' : m==='play' ? '✅ 보관하고 다음 촬영' : '📷 '+(stream?'촬영 시작':'카메라 시작');
}

async function startCam(){
  showErr(''); stopCam();
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ showErr(location.protocol==='content:'?'지금 content:// 주소로 열려 있어서 카메라가 막혀요. https 링크로 열어 주세요.':'이 주소에서는 카메라를 쓸 수 없어요. https 주소에서 열어 주세요.'); return; }
  try{ stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1280},height:{ideal:720}},audio:false}); }
  catch(e){ stream=null; showErr(e&&e.name==='NotAllowedError'?'카메라 권한이 막혀 있어요. 주소창 옆 자물쇠 → 카메라 허용으로 바꿔 주세요.':'카메라를 열지 못했어요: '+(e&&e.message||e)); return; }
  live.srcObject=stream; try{ await live.play(); }catch(e){}
  try{ if('wakeLock' in navigator) wake=await navigator.wakeLock.request('screen'); }catch(e){}
}
function stopCam(){ if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; } try{ wake&&wake.release(); }catch(e){} }

async function begin(){
  if(!ac){ try{ ac=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  if(ac&&ac.state==='suspended') ac.resume();
  if(!stream){ await startCam(); setMode('idle'); return; }  /* 카메라만 켜요. 자리를 잡고 '촬영 시작'을 눌러야 이동 시간이 시작돼요 */
  clearInterval(timer); frames=[]; lastDrawn=null; lastNum=null;
  if(prepSec<=0){ startRec(); return; }
  prepEnd=performance.now()+prepSec*1000; setMode('prep'); $('badge').textContent='🏃 이동 시간'; $('badge').className='badge'; timer=setInterval(tick,100);
}
function cancel(){ clearInterval(timer); try{ if(mr&&mr.state!=='inactive') mr.stop(); }catch(e){} setMode('idle'); }
/* ===== 도우미 ===== */
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let msgT=null;
function msg(t,ms){ const m=$('msg'); m.textContent=t; clearTimeout(msgT); if(ms) msgT=setTimeout(()=>{ m.textContent=''; },ms); }
function sparkle(x,y,n){ const em=['✨','⭐','🎉','🏆','💫']; for(let i=0;i<n;i++){ const s=document.createElement('span'); s.className='sp'; s.textContent=em[i%em.length]; s.style.left=x+'px'; s.style.top=y+'px'; const a=Math.random()*6.283,d=60+Math.random()*140; s.style.setProperty('--dx',Math.cos(a)*d+'px'); s.style.setProperty('--dy',Math.sin(a)*d+'px'); document.body.appendChild(s); setTimeout(()=>s.remove(),1000); } }
async function fixWebm(b){ return b; }
const pv=document.createElement('video'); pv.muted=true; pv.defaultMuted=true; pv.playsInline=true; pv.preload='auto'; $('rv').appendChild(pv);
let pvReady=false,pvUrl=null,recLen=0;
function setSpeed(s){ speed=+s; pv.playbackRate=speed; $('spdRow').querySelectorAll('button').forEach(b=>b.classList.toggle('on',+b.dataset.s===speed)); try{ $('spd').value=String(speed); }catch(e){} }

/* ===== 촬영 · 재생 ===== */
function tick(){
  const now=performance.now();
  if(mode==='prep'){
    const left=Math.ceil((prepEnd-now)/1000);
    if(left<=0){ clearInterval(timer); startRec(); return; }
    $('cdNum').textContent=left;
    if(left!==lastNum){ lastNum=left; beep(left<=3?880:660,.12); }
  }else if(mode==='rec'){
    const el=(now-recStart)/1000;
    $('barFill').style.width=Math.min(100,el/recSec*100)+'%';
    $('badge').textContent='● 촬영 '+Math.max(0,Math.ceil(recSec-el))+'초';
    if(el>=recSec){ clearInterval(timer); endRec(); }
  }
}
function startRec(){
  clearInterval(timer);
  if(!stream||!window.MediaRecorder){ showErr('이 브라우저는 녹화를 지원하지 않아요. 최신 크롬·사파리에서 열어 주세요.'); setMode('idle'); return; }
  chunks=[]; clipBlob=null; recDate=Date.now();
  try{ const mt=pickMime(); mr=mt?new MediaRecorder(stream,{mimeType:mt}):new MediaRecorder(stream); }
  catch(e){ showErr('녹화를 시작하지 못했어요: '+(e&&e.message||e)); setMode('idle'); return; }
  mr.ondataavailable=e=>{ if(e.data&&e.data.size) chunks.push(e.data); };
  mr.start(500);
  recStart=performance.now(); $('barFill').style.width='0%';
  setMode('rec'); $('badge').className='badge rec'; $('badge').textContent='● 촬영 중'; beep(1200,.35);
  timer=setInterval(tick,100);
}
function endRec(){
  clearInterval(timer); recLen=(performance.now()-recStart)/1000;
  const m=mr;
  clipP=new Promise(res=>{
    if(m&&m.state!=='inactive'){

const MX={

  u32(n){ return [(n>>>24)&255,(n>>>16)&255,(n>>>8)&255,n&255]; },
  u16(n){ return [(n>>8)&255,n&255]; },
  s(t){ return Array.from(t).map(c=>c.charCodeAt(0)); },
  box(t){ const c=[].slice.call(arguments,1).map(x=>x instanceof Uint8Array?x:new Uint8Array(x)); const b=MX.cat(c); return MX.cat([new Uint8Array(MX.u32(b.length+8)),new Uint8Array(MX.s(t)),b]); },

    const dur=[]; for(let i=0;i<n;i++){ dur.push(i<n-1?Math.max(1,Math.round(samples[i+1].ts-samples[i].ts)):(dur[i-1]||33)); }
    const total=dur.reduce((a,b)=>a+b,0);
    const mat=[].concat(u32(0x10000),Z(12),u32(0x10000),Z(12),u32(0x40000000));
    const ftyp=box('ftyp',MX.s('isom'),u32(512),MX.s('isom'),MX.s('iso2'),MX.s('avc1'),MX.s('mp41'));

    const mvhd=box('mvhd',Z(4),u32(0),u32(0),u32(1000),u32(total),u32(0x10000),u16(0x100),Z(10),mat,Z(24),u32(2));
    const tkhd=box('tkhd',[0,0,0,3],u32(0),u32(0),u32(1),Z(4),u32(total),Z(8),Z(2),Z(2),u16(0),Z(2),mat,u32(w<<16),u32(h<<16));
    const mdhd=box('mdhd',Z(4),u32(0),u32(0),u32(1000),u32(total),u16(0x55c4),Z(2));
    const hdlr=box('hdlr',Z(4),Z(4),MX.s('vide'),Z(12),[86,0]);
    const vmhd=box('vmhd',[0,0,0,1],Z(8));

const mp4Cache=new WeakMap();
async function toMp4(blob,opt){
  if(!opt&&/mp4/.test(blob.type||'')) return blob;
  if(!opt&&mp4Cache.has(blob)) return mp4Cache.get(blob);
  if(!window.VideoEncoder||!window.VideoFrame) return null;
  const U=URL.createObjectURL(blob),v=document.createElement('video');
  v.muted=true; v.defaultMuted=true; v.playsInline=true; v.preload='auto'; v.style.cssText='position:fixed;left:-9999px;width:2px;height:2px';
  document.body.appendChild(v);
  let enc=null;
  try{
    v.src=U;
    await new Promise((ok,no)=>{ v.onloadeddata=ok; v.onerror=()=>no(new Error('load')); setTimeout(()=>no(new Error('timeout')),10000); v.load(); });
    let w=v.videoWidth,h=v.videoHeight; if(!w||!h) throw new Error('size');
    const sc=Math.min(1,1920/Math.max(w,h)); w=Math.floor(w*sc/2)*2; h=Math.floor(h*sc/2)*2;
    let cfg=null;
    for(const codec of ['avc1.42001f','avc1.420028','avc1.42002a']){
      const c={codec,width:w,height:h,bitrate:Math.round(Math.min(8e6,Math.max(1.5e6,w*h*3))),framerate:30,avc:{format:'avc'}};
      try{ const r=await VideoEncoder.isConfigSupported(c); if(r&&r.supported){ cfg=c; break; } }catch(e){}
    }
    if(!cfg) throw new Error('noenc');
    const cv=document.createElement('canvas'); cv.width=w; cv.height=h; const cx=cv.getContext('2d');
    const samples=[]; let desc=null,err=null;
    enc=new VideoEncoder({output:(ch,meta)=>{ if(!desc&&meta&&meta.decoderConfig&&meta.decoderConfig.description) desc=new Uint8Array(meta.decoderConfig.description); const d=new Uint8Array(ch.byteLength); ch.copyTo(d); samples.push({d,ts:ch.timestamp/1000,key:ch.type==='key'}); },error:e=>{ err=e; }});
    enc.configure(cfg);
    let n=0,last=-1,t0=null;
    await new Promise((ok,no)=>{
      const lim=setTimeout(()=>no(new Error('long')),(isFinite(v.duration)&&v.duration>0?v.duration*2:120)*1000+15000);
      const fin=()=>{ clearTimeout(lim); ok(); };
      const step=(now,md)=>{
        if(err){ clearTimeout(lim); no(err); return; }
        const t=md&&md.mediaTime!=null?md.mediaTime:v.currentTime;
        if(t>last&&v.readyState>=2){
          last=t; if(t0===null) t0=t;
          if(opt&&opt.mir){ cx.save(); cx.translate(w,0); cx.scale(-1,1); cx.drawImage(v,0,0,w,h); cx.restore(); } else cx.drawImage(v,0,0,w,h);
          if(opt&&opt.startAt) drawStamp(cx,12,12,opt.startAt+t*1000,Math.max(18,Math.round(w/22)));
          const f=new VideoFrame(cv,{timestamp:Math.round((t-t0)*1e6)});
          try{ enc.encode(f,{keyFrame:n%60===0}); }catch(e){ f.close(); clearTimeout(lim); no(e); return; }
          f.close(); n++;
        }
        if(v.ended) fin(); else next();
      };
      const next=()=>{ if(v.requestVideoFrameCallback) v.requestVideoFrameCallback(step); else requestAnimationFrame(()=>step(0,null)); };
      v.onended=()=>setTimeout(fin,50);
      v.onerror=()=>{ clearTimeout(lim); no(new Error('play')); };
      v.playbackRate=2;
      v.play().then(next).catch(no);
    });
    await enc.flush(); try{ enc.close(); }catch(e){}
    if(err||!desc||samples.length<2) throw new Error('empty');
    const out=MX.mux(w,h,desc,samples);
    if(!opt) mp4Cache.set(blob,out); return out;
  }catch(e){ try{ if(enc&&enc.state!=='closed') enc.close(); }catch(_){} return null; }
  finally{ v.pause(); v.remove(); URL.revokeObjectURL(U); }
}
/* 파일 목록을 mp4로 (안 되면 원본 그대로) */
async function mp4All(list,onProg){
  const out=[]; window._webmLeft=false;
  for(let i=0;i<list.length;i++){
    const f=list[i]; if(onProg) onProg(i+1,list.length);
    if(/mp4/.test(f.blob.type||'')){ out.push(f); continue; }
    const m=await toMp4(f.blob);
    if(m) out.push({blob:m,name:f.name.replace(/\.webm$/i,'.mp4')}); else { window._webmLeft=true; out.push(f); }
  }
  return out;
}

    $('pA').onclick=()=>choose('A'); $('pB').onclick=()=>choose('B');
    $('pX').onclick=()=>{ if(!chosen&&confirm('월드컵을 중단할까요? 지금까지 고른 결과는 저장되지 않아요.')) fin(null); };
    go();
  });
}

/* ---- 경기마다 "왼쪽 나은 영상 | 오른쪽 부족한 영상" 좌우 분할 영상을 만들어요 (고르는 동안 뒤에서 차례로) ---- */
async function renderCmp(job){
  if(!window.MediaRecorder||!HTMLCanvasElement.prototype.captureStream) return null;
  const mt=pickMime(); if(!mt) return null;
  const host=$('rv'),W=job.win,L=job.lose;
  const mk=b=>{ const v=document.createElement('video'); v.muted=true; v.defaultMuted=true; v.playsInline=true; v.preload='auto'; v._u=URL.createObjectURL(b); v.src=v._u; host.appendChild(v); return v; };
  const va=mk(W.blob),vb=mk(L.blob);
  let rec=null,iv=null;
  try{
    await Promise.all([va,vb].map(v=>new Promise((ok,no)=>{
      const to=setTimeout(()=>no(new Error('load')),10000);
      v.onloadeddata=()=>{ clearTimeout(to); ok(); }; v.onerror=()=>{ clearTimeout(to); no(new Error('err')); };
      if(v.readyState>=2){ clearTimeout(to); ok(); }
    })));
    if(job.dead) return null;
    const vw=va.videoWidth||720,vh=va.videoHeight||1280,HEAD=64,GAP=6,ph=640;
    let pw=Math.round(ph*vw/vh); pw=Math.max(360,Math.min(720,pw))&~1;
    const cv=document.createElement('canvas'); cv.width=pw*2+GAP; cv.height=ph+HEAD; const c=cv.getContext('2d');
    const fit=(v,x,y,w,h)=>{
      const a=(v.videoWidth/v.videoHeight)||1; let dw=w,dh=w/a; if(dh>h){ dh=h; dw=h*a; }
      const dx=x+(w-dw)/2,dy=y+(h-dh)/2;
      if(job.mir){ c.save(); c.translate(dx+dw,dy); c.scale(-1,1); c.drawImage(v,0,0,dw,dh); c.restore(); } else c.drawImage(v,dx,dy,dw,dh);
    };
    const draw=()=>{
      c.fillStyle='#000'; c.fillRect(0,0,cv.width,cv.height);
      c.fillStyle='#14382a'; c.fillRect(0,0,pw,HEAD); c.fillStyle='#4a1a1a'; c.fillRect(pw+GAP,0,pw,HEAD);
      c.font='bold 26px sans-serif'; c.textAlign='center'; c.textBaseline='middle';
      c.fillStyle='#5fe0a0'; c.fillText('🏆 나은 동작 · #'+W.id,pw/2,HEAD/2);
      c.fillStyle='#ff9a9a'; c.fillText('부족한 동작 · #'+L.id,pw+GAP+pw/2,HEAD/2);
      fit(va,0,HEAD,pw,ph); fit(vb,pw+GAP,HEAD,pw,ph);
      const sfs=Math.max(16,Math.round(pw/21));
      if(W.startAt) drawStamp(c,8,HEAD+6,W.startAt+va.currentTime*1000,sfs);
      if(L.startAt) drawStamp(c,pw+GAP+8,HEAD+6,L.startAt+vb.currentTime*1000,sfs);
      c.font='bold 22px sans-serif'; c.textAlign='left'; c.textBaseline='bottom'; c.fillStyle='rgba(255,255,255,.9)';
      c.shadowColor='#000'; c.shadowBlur=6; c.fillText('월드컵 '+job.round+'라운드 · '+job.k+'경기',10,cv.height-8); c.shadowBlur=0;
    };
    draw();
    let da=false,db=false; va.onended=()=>{ da=true; }; vb.onended=()=>{ db=true; };
    rec=new MediaRecorder(cv.captureStream(30),{mimeType:mt,videoBitsPerSecond:4e6});
    const chunks=[]; rec.ondataavailable=e=>{ if(e.data&&e.data.size) chunks.push(e.data); };
    const stopped=new Promise(r=>{ rec.onstop=r; });
    try{ va.currentTime=0; vb.currentTime=0; }catch(e){}
    await Promise.all([va.play(),vb.play()]);
    rec.start(); const t0=performance.now(); iv=setInterval(draw,33);
    const dA=isFinite(va.duration)?va.duration:0,dB=isFinite(vb.duration)?vb.duration:0;
    const limit=(dA||dB)?Math.max(dA,dB)*1000+3000:45000;
    while(!(da&&db)&&!job.dead&&performance.now()-t0<limit) await sleep(60);
    draw(); await sleep(150); clearInterval(iv); iv=null;
    const ms=performance.now()-t0;
    rec.stop(); await stopped;
    if(job.dead||!chunks.length) return null;
    let b=new Blob(chunks,{type:mt.split(';')[0]}); if(b.type==='video/webm') b=await fixWebm(b,ms);
    return {blob:b,ext:b.type.includes('mp4')?'mp4':'webm'};
  }catch(e){ return null; }
  finally{
    if(iv) clearInterval(iv);
    try{ if(rec&&rec.state!=='inactive') rec.stop(); }catch(e){}
    [va,vb].forEach(v=>{ try{ v.pause(); }catch(e){} v.removeAttribute('src'); try{ v.load(); }catch(e){} URL.revokeObjectURL(v._u); v.remove(); });
  }
}
/* ---- 영상 한 개에 날짜·시간을 박아서 새 영상으로 만들어요 ---- */
async function renderStamp(clip,mir){
  if(clip.startAt){ try{ const m=await toMp4(clip.blob,{startAt:clip.startAt,mir}); if(m) return {blob:m,ext:'mp4'}; }catch(e){} }
  const mt=pickMime(); if(!mt||!clip.startAt||!HTMLCanvasElement.prototype.captureStream) return null;
  const host=$('rv'),v=document.createElement('video'); v.muted=true; v.defaultMuted=true; v.playsInline=true; v.preload='auto'; v._u=URL.createObjectURL(clip.blob); v.src=v._u; host.appendChild(v);
  let rec=null,iv=null;
  try{
    await new Promise((ok,no)=>{ const to=setTimeout(()=>no(new Error('load')),10000); v.onloadeddata=()=>{ clearTimeout(to); ok(); }; v.onerror=()=>{ clearTimeout(to); no(new Error('err')); }; if(v.readyState>=2){ clearTimeout(to); ok(); } });
    const w=(v.videoWidth||720)&~1,h=(v.videoHeight||1280)&~1,fs=Math.max(18,Math.round(w/22));
    const cv=document.createElement('canvas'); cv.width=w; cv.height=h; const c=cv.getContext('2d');
    const draw=()=>{ c.fillStyle='#000'; c.fillRect(0,0,w,h);
      if(mir){ c.save(); c.translate(w,0); c.scale(-1,1); c.drawImage(v,0,0,w,h); c.restore(); } else c.drawImage(v,0,0,w,h);
      drawStamp(c,12,12,clip.startAt+v.currentTime*1000,fs); };
    draw(); let dn=false; v.onended=()=>{ dn=true; };
    rec=new MediaRecorder(cv.captureStream(30),{mimeType:mt,videoBitsPerSecond:4e6});
    const chunks=[]; rec.ondataavailable=e=>{ if(e.data&&e.data.size) chunks.push(e.data); };
    const stopped=new Promise(r=>{ rec.onstop=r; });
    try{ v.currentTime=0; }catch(e){}
    await v.play(); rec.start(); const t0=performance.now(); iv=setInterval(draw,33);
    const d=isFinite(v.duration)?v.duration:0,limit=d?d*1000+3000:45000;
    while(!dn&&performance.now()-t0<limit) await sleep(60);
    draw(); await sleep(150); clearInterval(iv); iv=null;
    const ms=performance.now()-t0; rec.stop(); await stopped;
    if(!chunks.length) return null;
    let b=new Blob(chunks,{type:mt.split(';')[0]}); if(b.type==='video/webm') b=await fixWebm(b,ms);
    return {blob:b,ext:b.type.includes('mp4')?'mp4':'webm'};
  }catch(e){ return null; }
  finally{
    if(iv) clearInterval(iv);
    try{ if(rec&&rec.state!=='inactive') rec.stop(); }catch(e){}
    try{ v.pause(); }catch(e){} v.removeAttribute('src'); try{ v.load(); }catch(e){} URL.revokeObjectURL(v._u); v.remove();
  }
}
function enqueue(job){
  job.p=RQ.chain=RQ.chain.then(async()=>{
    if(job.dead){ job.done=true; return; }
    try{ job.out=await renderCmp(job); }catch(e){ job.out=null; }
    job.done=true;
  });
}

/* ---- 최후의 1영상 + 한 번에 저장 → 저장해야 다음으로 넘어가요 ---- */

    const vc=$('cvC'),uc=URL.createObjectURL(champ.blob); vc.src=uc; vc.play().catch(()=>{});

    sj.p=RQ.chain=RQ.chain.then(async()=>{ try{ sj.out=await renderStamp(champ,mirNow); }catch(e){ sj.out=null; } sj.done=true; });

    const mkFiles=()=>{

/* ---- 월드컵 진행: 1라운드 → 2라운드 → … → 최후의 1영상 ---- */
async function runCup(){
  if(CUP.busy) return; CUP.busy=true;
  const jobs=[]; RQ.chain=Promise.resolve();
  const abort=()=>{ jobs.forEach(j=>{ j.dead=true; }); toIdle(); };
  try{
    let cur=TR.pool.slice(),round=0;
    if(cur.length<2) return;
    while(cur.length>1){
      round++; const total=Math.floor(cur.length/2),next=[],bye=(cur.length%2)?cur[cur.length-1]:null;
      for(let i=0,k=1;i+1<cur.length;i+=2,k++){
        const r=await askBest(cur[i],cur[i+1],{round,k,total,bye});
        if(!r){ abort(); return; }
        const win=r==='A'?cur[i]:cur[i+1],lose=r==='A'?cur[i+1]:cur[i];
        next.push(win);
        const job={win,lose,round,k,mir:stage.classList.contains('mir'),dead:false,done:false,out:null};
        jobs.push(job); enqueue(job);
      }
      if(bye) next.push(bye);
      cur=next;
    }
    const champ=cur[0];
    const r=await showChamp(champ,jobs);
    if(r==='again'){ champ.id=1; TR.seq=1; TR.pool=[champ]; TR.pend=null; toIdle(); msg('🥇 최고 영상 #1과 비교할 영상을 찍어요',4000); }
    else{ TR.move++; TR.seq=0; TR.cup=0; TR.pool=[]; TR.pend=null; toIdle(); showErr(''); msg('🆕 기록을 초기화했어요. 새 동작을 촬영해요.',4000); }
  }finally{ CUP.busy=false; }
}
